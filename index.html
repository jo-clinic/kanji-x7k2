<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex, nofollow">
<title>漢字の征服 トレーニング</title>
<style>
:root{
  --blue:#2b6cb0; --blue-d:#1a365d; --bg:#f0f6fc; --card:#ffffff;
  --green:#2f9e44; --red:#e03131; --amber:#f59f00; --ink:#1a1a1a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;}
input{-webkit-user-select:text; user-select:text;}
html,body{height:100%;}
body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans",-apple-system,"Noto Sans CJK JP",sans-serif;
  background:var(--bg); color:var(--ink); overscroll-behavior:none;}
.screen{display:none; max-width:900px; margin:0 auto; padding:16px; min-height:100%;}
.screen.active{display:block;}
h1{font-size:22px; color:var(--blue-d); margin:8px 0 4px;}
h2{font-size:18px; color:var(--blue); margin:14px 0 8px;}
.sub{color:#666; font-size:13px; margin-bottom:12px;}
.card{background:var(--card); border-radius:16px; padding:16px; box-shadow:0 2px 8px rgba(0,0,0,.07); margin-bottom:14px;}
button{font-family:inherit; border:none; border-radius:14px; cursor:pointer; touch-action:manipulation;}
.btn-main{display:block; width:100%; padding:16px; font-size:20px; font-weight:bold; background:var(--blue); color:#fff;}
.btn-main:disabled{background:#b8c6d8;}
.btn-sub{padding:10px 16px; font-size:15px; background:#e7eef7; color:var(--blue-d); font-weight:bold;}
.btn-green{background:var(--green); color:#fff;}
.btn-red{background:var(--red); color:#fff;}
.btn-amber{background:var(--amber); color:#fff;}
.unit-grid{display:flex; flex-wrap:wrap; gap:8px;}
.unit-chip{width:52px; height:44px; border-radius:10px; background:#e7eef7; color:var(--blue-d);
  font-size:16px; font-weight:bold; display:flex; align-items:center; justify-content:center;}
.unit-chip.sel{background:var(--blue); color:#fff;}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
.seg{display:flex; border-radius:12px; overflow:hidden; border:2px solid var(--blue);}
.seg button{border-radius:0; padding:10px 18px; font-size:16px; background:#fff; color:var(--blue); font-weight:bold;}
.seg button.sel{background:var(--blue); color:#fff;}
#q-progress{font-size:15px; font-weight:bold; color:var(--blue-d);}
#q-bar{height:8px; background:#dde7f2; border-radius:4px; overflow:hidden; margin:6px 0 12px;}
#q-bar div{height:100%; background:var(--blue); width:0%; transition:width .3s;}
.qtype-tag{display:inline-block; padding:3px 10px; border-radius:8px; font-size:13px; font-weight:bold; color:#fff; background:var(--blue); margin-bottom:8px;}
.qtype-tag.yomi{background:var(--green);}
.qtype-tag.goi{background:var(--amber);}
#q-text{font-size:24px; line-height:1.8; margin:6px 0 4px;}
#q-text .target{font-weight:900; font-size:1.25em; border-bottom:4px solid var(--red); padding:0 2px;}
.hint{color:#888; font-size:13px;}
#pad-wrap{position:relative; margin-top:10px;}
#pad{background:#fff; border:2px solid var(--blue); border-radius:12px; width:100%; touch-action:none; display:block;}
#pad-guide{position:absolute; top:0; left:0; right:0; bottom:0; pointer-events:none; display:flex;}
#pad-guide .box{flex:1; border-right:2px dashed #c9d8ea; display:flex; align-items:center; justify-content:center;}
#pad-guide .box:last-child{border-right:none;}
#pad-guide .box span{color:#eef3f9; font-size:60px; font-weight:bold;}
.pad-btns{display:flex; gap:10px; margin-top:10px;}
#yomi-input{width:100%; font-size:26px; padding:12px; border:2px solid var(--green); border-radius:12px; margin-top:10px;}
#judge-mark{font-size:80px; text-align:center; font-weight:bold; margin:4px 0;}
#judge-mark.ok{color:var(--red);}
#judge-mark.ng{color:#1c7ed6;}
#judge-answer{text-align:center; font-size:56px; font-weight:bold; letter-spacing:6px; margin:6px 0; color:var(--ink);}
#judge-note{text-align:center; color:#666; font-size:14px; margin-bottom:10px;}
#judge-user{text-align:center; font-size:15px; color:#888;}
.judge-btns{display:flex; gap:10px; margin-top:14px;}
.judge-btns button{flex:1; padding:14px; font-size:17px; font-weight:bold;}
#result-score{font-size:44px; font-weight:bold; text-align:center; color:var(--blue-d); margin:8px 0;}
#result-msg{text-align:center; font-size:20px; margin-bottom:10px;}
.wrong-item{padding:10px; border-bottom:1px solid #eee; font-size:16px;}
.wrong-item b{color:var(--red);}
.badge{display:inline-block; background:var(--amber); color:#fff; border-radius:8px; padding:2px 8px; font-size:12px; font-weight:bold;}
#loading{position:fixed; inset:0; background:rgba(255,255,255,.7); display:none; align-items:center; justify-content:center; font-size:20px; font-weight:bold; color:var(--blue-d); z-index:50;}
.foot{color:#aaa; font-size:11px; text-align:center; margin:20px 0 8px;}
</style>
</head>
<body>

<div id="loading">はんてい中…</div>

<!-- あいことばゲート -->
<div id="gate" style="position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;">
  <div class="card" style="width:320px;text-align:center">
    <h1 style="font-size:20px;margin-bottom:10px">漢字の征服 トレーニング</h1>
    <div class="sub">あいことばを入れてね</div>
    <input id="gate-input" type="text" inputmode="numeric" autocomplete="off"
      style="width:100%;font-size:28px;padding:10px;text-align:center;border:2px solid var(--blue);border-radius:12px;margin:8px 0;">
    <button class="btn-main" onclick="checkGate()">はいる</button>
    <div id="gate-msg" style="color:var(--red);font-size:14px;margin-top:8px;height:18px"></div>
  </div>
</div>

<!-- ホーム（プロトタイプ: 範囲を選んで小テスト） -->
<div class="screen active" id="scr-home">
  <h1>漢字の征服 トレーニング</h1>
  <div class="sub">プロトタイプ版: 範囲を選んで小テストができます</div>
  <div class="card">
    <h2>征服Ⅰ の単元</h2>
    <div class="unit-grid" id="units1"></div>
    <h2>征服Ⅱ の単元</h2>
    <div class="unit-grid" id="units2"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn-sub" onclick="selAll(1)">Ⅰ全部</button>
      <button class="btn-sub" onclick="selAll(2)">Ⅱ全部</button>
      <button class="btn-sub" onclick="selNone()">えらび直す</button>
    </div>
  </div>
  <div class="card">
    <div class="row">
      <span style="font-weight:bold">問題数:</span>
      <div class="seg" id="qcount-seg">
        <button data-n="10">10問</button>
        <button data-n="25" class="sel">25問</button>
      </div>
      <label style="font-size:15px; font-weight:bold; margin-left:6px">
        <input type="checkbox" id="mix-goi" checked style="transform:scale(1.4); margin-right:6px">類義語・対義語もまぜる
      </label>
    </div>
  </div>
  <button class="btn-main" id="btn-start" onclick="startQuiz()">テストをつくる！</button>
  <div class="foot">漢字の征服 学習アプリ プロトタイプ（家庭内利用）</div>
</div>

<!-- 出題画面 -->
<div class="screen" id="scr-quiz">
  <div id="q-progress"></div>
  <div id="q-bar"><div></div></div>
  <div class="card">
    <span class="qtype-tag" id="q-tag">書き取り</span>
    <div id="q-text"></div>
    <div class="hint" id="q-hint"></div>
    <div id="write-area">
      <div id="pad-wrap">
        <canvas id="pad"></canvas>
        <div id="pad-guide"></div>
        <canvas id="pad-live" style="position:absolute;top:0;left:0;pointer-events:none;"></canvas>
      </div>
      <div class="pad-btns">
        <button class="btn-sub" onclick="undoStroke()">↩ 一画もどす</button>
        <button class="btn-sub" onclick="clearPad()">ぜんぶけす</button>
        <button class="btn-sub" id="kb-toggle" style="display:none" onclick="setInputMode(true)">⌨ キーボードで入力</button>
      </div>
    </div>
    <div id="yomi-area" style="display:none">
      <input id="yomi-input" type="text" placeholder="ひらがなで書く" autocomplete="off">
      <div class="pad-btns">
        <button class="btn-sub" onclick="setInputMode(false)">✏ 手書きにもどす</button>
      </div>
    </div>
  </div>
  <button class="btn-main btn-green" onclick="submitAnswer()">こたえあわせ</button>
  <div style="display:flex; justify-content:space-between; margin-top:10px">
    <button class="btn-sub" id="btn-back" onclick="backOne()" style="display:none">◀ まえの問題をやり直す</button>
    <button class="btn-sub" onclick="quitQuiz()">やめる</button>
  </div>
</div>

<!-- 判定画面 -->
<div class="screen" id="scr-judge">
  <div id="q-progress2" style="font-size:15px;font-weight:bold;color:var(--blue-d);margin-bottom:8px"></div>
  <div class="card">
    <div id="judge-mark"></div>
    <div id="judge-note"></div>
    <div id="judge-answer"></div>
    <div id="judge-user"></div>
    <div class="judge-btns" id="judge-confirm" style="display:none">
      <button class="btn-green" onclick="confirmJudge(true)">あってた ○</button>
      <button class="btn-red" onclick="confirmJudge(false)">まちがえた ×</button>
    </div>
    <div class="judge-btns" id="judge-next" style="display:none">
      <button class="btn-main" onclick="nextQuestion()" style="flex:1">つぎへ ▶</button>
    </div>
  </div>
</div>

<!-- 結果画面 -->
<div class="screen" id="scr-result">
  <h1>けっか</h1>
  <div class="card">
    <div id="result-score"></div>
    <div id="result-msg"></div>
  </div>
  <div class="card" id="result-wrong-card">
    <h2>まちがえた問題 <span class="badge" id="wrong-count"></span></h2>
    <div id="wrong-list"></div>
  </div>
  <button class="btn-main btn-amber" id="btn-retry" onclick="retryWrong()">まちがい直しをする</button>
  <div style="height:10px"></div>
  <button class="btn-main" onclick="goHome()">ホームにもどる</button>
</div>

const DATA=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(DATA_B64),c=>c.charCodeAt(0))));
// ---------- あいことばゲート ----------
const PASS = '1192'; // あいことば（変更したい場合はここを書きかえて再アップ）
function checkGate(){
  const v = document.getElementById('gate-input').value.trim();
  if(v===PASS){ try{localStorage.setItem('gate_ok','1');}catch(e){} document.getElementById('gate').style.display='none'; }
  else { document.getElementById('gate-msg').textContent='あいことばがちがうよ'; }
}
document.addEventListener('DOMContentLoaded',()=>{
  try{ if(localStorage.getItem('gate_ok')==='1') document.getElementById('gate').style.display='none'; }catch(e){}

// ---------- 状態 ----------
const S = {
  sel1:new Set(), sel2:new Set(), qcount:25,
  quiz:[], idx:0, results:[], // {q, correct, auto}
  pending:null, todayIds:new Set()
};

// ---------- ホームUI ----------
function buildUnitChips(){
  for(const book of [1,2]){
    const wrap = document.getElementById('units'+book);
    const units = (book===1? DATA.s1 : DATA.s2).units;
    units.forEach(u=>{
      const b=document.createElement('button');
      b.className='unit-chip'; b.textContent=u.unit;
      b.onclick=()=>{ const set = book===1?S.sel1:S.sel2;
        set.has(u.unit)?set.delete(u.unit):set.add(u.unit);
        b.classList.toggle('sel'); updateStart(); };
      wrap.appendChild(b);
    });
  }
  document.querySelectorAll('#qcount-seg button').forEach(b=>{
    b.onclick=()=>{ document.querySelectorAll('#qcount-seg button').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel'); S.qcount=+b.dataset.n; };
  });
}
function selAll(book){ const units=(book===1?DATA.s1:DATA.s2).units; const set=book===1?S.sel1:S.sel2;
  units.forEach(u=>set.add(u.unit));
  refreshChips(); updateStart(); }
function selNone(){ S.sel1.clear(); S.sel2.clear(); refreshChips(); updateStart(); }
function refreshChips(){
  [1,2].forEach(book=>{
    const set=book===1?S.sel1:S.sel2;
    document.querySelectorAll('#units'+book+' .unit-chip').forEach(b=>{
      b.classList.toggle('sel', set.has(+b.textContent));
    });
  });
}
function updateStart(){
  document.getElementById('btn-start').disabled = (S.sel1.size+S.sel2.size)===0;
}

// ---------- 出題生成 ----------
function poolFromSelection(){
  const pool=[];
  [[DATA.s1,S.sel1,'征服Ⅰ'],[DATA.s2,S.sel2,'征服Ⅱ']].forEach(([d,set,name])=>{
    d.units.forEach(u=>{ if(set.has(u.unit)) u.questions.forEach(q=>{
      pool.push({id:q.id, src:name+' 単元'+u.unit, qtype:(q.qtype||'書き取り'), question:q.question, answer:q.answer});
    });});
  });
  return pool;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function startQuiz(){
  const pool = poolFromSelection();
  if(pool.length===0) return;
  const kaki = shuffle(pool.filter(q=>q.qtype==='書き取り'));
  const yomi = shuffle(pool.filter(q=>q.qtype==='読み'));
  const n = S.qcount;
  let nYomi = Math.min(yomi.length, Math.round(n*0.2));
  let nGoi = 0, goiQs=[];
  if(document.getElementById('mix-goi').checked && DATA.goi.length){
    nGoi = Math.min(3, Math.round(n*0.12), DATA.goi.length);
    goiQs = shuffle(DATA.goi.slice()).slice(0,nGoi).map(g=>({
      id:g.id, src:'国語要覧', qtype:g.kind,
      question:'「'+g.word1+'」の'+g.kind+'を漢字で書きなさい。', answer:g.word2}));
  }
  const nKaki = Math.min(kaki.length, n-nYomi-nGoi);
  S.quiz = shuffle([...kaki.slice(0,nKaki), ...yomi.slice(0,nYomi), ...goiQs]);
  if(S.quiz.length===0) return;
  S.idx=0; S.results=[];
  showScreen('scr-quiz'); renderQuestion();
}

// ---------- 出題表示 ----------
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function renderQuestion(){
  const q = S.quiz[S.idx];
  document.getElementById('q-progress').textContent = (S.idx+1)+' / '+S.quiz.length+' 問目';
  document.getElementById('btn-back').style.display = S.results.length? 'inline-block':'none';
  document.querySelector('#q-bar div').style.width = (S.idx/S.quiz.length*100)+'%';
  const tag=document.getElementById('q-tag');
  tag.textContent = q.qtype; tag.className='qtype-tag'+(q.qtype==='読み'?' yomi':(q.qtype==='類義語'||q.qtype==='対義語')?' goi':'');
  const html = esc(q.question).replace(/【(.+?)】/g,'<span class="target">$1</span>');
  document.getElementById('q-text').innerHTML = html;
  const isYomi = q.qtype==='読み';
  document.getElementById('kb-toggle').style.display = isYomi? 'inline-block':'none';
  document.getElementById('q-hint').textContent = isYomi
    ? '答えは '+q.answer.length+' 文字。よみをひらがなで、わくの中に大きく書いてね'
    : '答えは '+q.answer.length+' 文字。わくの中に大きく書いてね';
  setInputMode(false);
  setupPad(q.answer.length);
}
function setInputMode(keyboard){
  document.getElementById('write-area').style.display = keyboard?'none':'block';
  document.getElementById('yomi-area').style.display = keyboard?'block':'none';
  if(keyboard){ const inp=document.getElementById('yomi-input'); inp.value=''; setTimeout(()=>inp.focus(),100); }
}

// ---------- 手書きパッド ----------
// 確定した画=下のcanvas(pad)、書いている最中の画=上のcanvas(pad-live)に分離。
// 描画はrequestAnimationFrameで1フレーム1回。Pencilの予測点も先に描いて体感遅延を減らす。
let pad, ctx, live, lctx, strokes=[], cur=null, predicted=[], rafPending=false, padW=0, padH=0, padRect=null;
function styleCtx(c){ c.lineWidth=6; c.lineCap='round'; c.lineJoin='round'; c.strokeStyle='#111'; }
function setupPad(nChars){
  pad = document.getElementById('pad'); live = document.getElementById('pad-live');
  const wrap = document.getElementById('pad-wrap');
  padW = wrap.clientWidth; padH = Math.min(430, Math.max(240, Math.floor(window.innerHeight*0.42)));
  for(const c of [pad, live]){ c.width=padW*2; c.height=padH*2; c.style.width=padW+'px'; c.style.height=padH+'px'; }
  ctx = pad.getContext('2d'); ctx.scale(2,2); styleCtx(ctx);
  lctx = live.getContext('2d'); lctx.scale(2,2); styleCtx(lctx);
  strokes=[]; cur=null; predicted=[]; redraw(); lctx.clearRect(0,0,padW,padH);
  const g = document.getElementById('pad-guide');
  g.innerHTML=''; for(let i=0;i<nChars;i++){ const d=document.createElement('div'); d.className='box'; g.appendChild(d); }
  if(!pad._bound){
    pad.addEventListener('pointerdown', e=>{ e.preventDefault(); pad.setPointerCapture(e.pointerId);
      padRect = pad.getBoundingClientRect();
      cur={x:[],y:[],t:[]}; addPt(e); predicted=[]; scheduleLive(); });
    pad.addEventListener('pointermove', e=>{ if(!cur) return;
      const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      for(const ev of evs) addPt(ev);
      predicted = e.getPredictedEvents ? e.getPredictedEvents().map(toPt) : [];
      scheduleLive(); });
    const finish = e=>{ if(!cur) return;
      commitStroke(cur); strokes.push(cur); cur=null; predicted=[];
      lctx.clearRect(0,0,padW,padH); };
    pad.addEventListener('pointerup', finish);
    pad.addEventListener('pointercancel', finish);
    pad._bound=true;
  }
}
function toPt(e){ return {x:Math.round(e.clientX-padRect.left), y:Math.round(e.clientY-padRect.top)}; }
function addPt(e){ const p=toPt(e); cur.x.push(p.x); cur.y.push(p.y); cur.t.push(Date.now()); return p; }
function scheduleLive(){
  if(rafPending) return; rafPending=true;
  requestAnimationFrame(()=>{ rafPending=false; drawLive(); });
}
function manualPredict(){
  // Safariが予測点をくれない場合、直近の速度から自前で先読み（ライブ表示のみ・確定インクには使わない）
  const n=cur.x.length; if(n<3) return [];
  const i1=n-1, i0=Math.max(0,n-4);
  const dt=(cur.t[i1]-cur.t[i0])||1;
  let dx=(cur.x[i1]-cur.x[i0])/dt*28, dy=(cur.y[i1]-cur.y[i0])/dt*28; // 約28ms先
  const d=Math.hypot(dx,dy), MAX=40;
  if(d>MAX){ dx*=MAX/d; dy*=MAX/d; }
  if(d<2) return [];
  return [{x:cur.x[i1]+dx*0.5,y:cur.y[i1]+dy*0.5},{x:cur.x[i1]+dx,y:cur.y[i1]+dy}];
}
function drawLive(){
  lctx.clearRect(0,0,padW,padH);
  if(!cur || cur.x.length===0) return;
  lctx.beginPath(); lctx.moveTo(cur.x[0],cur.y[0]);
  for(let i=1;i<cur.x.length;i++) lctx.lineTo(cur.x[i],cur.y[i]);
  const pred = predicted.length? predicted : manualPredict();
  for(const p of pred) lctx.lineTo(p.x,p.y);  // 予測点で先回り描画
  lctx.stroke();
}
function commitStroke(s){
  ctx.beginPath(); ctx.moveTo(s.x[0],s.y[0]);
  if(s.x.length===1) ctx.lineTo(s.x[0],s.y[0]);
  for(let i=1;i<s.x.length;i++) ctx.lineTo(s.x[i],s.y[i]);
  ctx.stroke();
}
function redraw(){
  ctx.clearRect(0,0,padW,padH);
  for(const s of strokes) commitStroke(s);
}
function undoStroke(){ strokes.pop(); redraw(); }
function clearPad(){ strokes=[]; cur=null; redraw(); if(lctx) lctx.clearRect(0,0,padW,padH); }

// ---------- 判定 ----------
async function recognize(){
  if(strokes.length===0) return [];
  const ink = strokes.map(s=>[s.x, s.y, s.t.map(t=>t-s.t[0])]);
  const body = { options:'enable_pre_space',
    requests:[{ writing_guide:{writing_area_width:padW, writing_area_height:padH},
      ink, language:'ja' }] };
  const resp = await fetch('https://inputtools.google.com/request?itc=ja-t-i0-handwrit&app=kanji-app', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const j = await resp.json();
  if(j[0]!=='SUCCESS') throw new Error('recog fail');
  return j[1][0][1]; // candidates
}
function normalizeAns(s){
  // 空白除去＋カタカナ→ひらがな（読み比較用）
  return s.replace(/\s/g,'').replace(/[ァ-ヶ]/g, c=>String.fromCharCode(c.charCodeAt(0)-0x60));
}
async function submitAnswer(){
  const q = S.quiz[S.idx];
  const kbShown = document.getElementById('yomi-area').style.display!=='none';
  if(q.qtype==='読み' && kbShown){
    const v = document.getElementById('yomi-input').value.trim();
    if(!v) return;
    judge(normalizeAns(v)===normalizeAns(q.answer), v, true);
    return;
  }
  if(strokes.length===0) return;
  document.getElementById('loading').style.display='flex';
  let cands=[], failed=false;
  try{ cands = await recognize(); }catch(e){ failed=true; }
  document.getElementById('loading').style.display='none';
  const ans = normalizeAns(q.answer);
  if(!failed && cands.slice(0,4).map(normalizeAns).includes(ans)){
    judge(true, cands[0], true);
  } else if(!failed){
    // 自動では×→自己確認へ
    judge(false, cands[0]||'（よみとれず）', false);
  } else {
    // オフライン等: 自己採点
    judge(false, '（はんてい不能・自分でくらべてね）', false);
  }
}
function judge(correct, userAns, auto){
  S.pending = {correct, userAns, auto};
  const q = S.quiz[S.idx];
  document.getElementById('q-progress2').textContent = (S.idx+1)+' / '+S.quiz.length+' 問目';
  const mark = document.getElementById('judge-mark');
  const note = document.getElementById('judge-note');
  document.getElementById('judge-answer').textContent = q.answer;
  document.getElementById('judge-user').textContent = auto&&correct ? '' : 'きみの答え: '+userAns;
  if(correct){
    mark.textContent='○'; mark.className='ok';
    note.textContent='せいかい！';
    document.getElementById('judge-confirm').style.display='none';
    document.getElementById('judge-next').style.display='flex';
    finalizeResult(true, true);
  } else {
    mark.textContent='?'; mark.className='ng';
    note.textContent='正かいとくらべてみよう。自分の字と同じならば「あってた○」を押してね';
    document.getElementById('judge-confirm').style.display='flex';
    document.getElementById('judge-next').style.display='none';
  }
  showScreen('scr-judge');
}
function confirmJudge(ok){
  const mark = document.getElementById('judge-mark');
  const note = document.getElementById('judge-note');
  if(ok){ mark.textContent='○'; mark.className='ok'; note.textContent='せいかい！'; }
  else { mark.textContent='×'; mark.className='ng'; note.textContent='おしい！この漢字はお宝候補に登録したよ'; }
  document.getElementById('judge-confirm').style.display='none';
  document.getElementById('judge-next').style.display='flex';
  finalizeResult(ok, false);
}
function finalizeResult(correct, auto){
  S.results.push({q:S.quiz[S.idx], correct, auto});
}
function nextQuestion(){
  S.idx++;
  if(S.idx>=S.quiz.length){ showResult(); }
  else { showScreen('scr-quiz'); renderQuestion(); }
}
function quitQuiz(){ if(confirm('テストをやめてホームにもどる？')) goHome(); }
function backOne(){
  // ひとつ前の問題の記録を取り消してやり直す（正解し直せばお宝に登録されない）
  if(S.results.length===0) return;
  S.results.pop(); S.idx--;
  showScreen('scr-quiz'); renderQuestion();
}

// ---------- 結果 ----------
function showResult(){
  const total=S.results.length, ok=S.results.filter(r=>r.correct).length;
  document.getElementById('result-score').textContent = ok+' / '+total+' 問正解';
  const rate = ok/total;
  document.getElementById('result-msg').textContent =
    rate===1 ? '🎉 パーフェクト！すごい！' : rate>=0.8 ? 'あと少しで満点！' : 'まちがえた漢字を退治しよう！';
  const wrong = S.results.filter(r=>!r.correct);
  document.getElementById('wrong-count').textContent = wrong.length+'問';
  document.getElementById('result-wrong-card').style.display = wrong.length? 'block':'none';
  document.getElementById('btn-retry').style.display = wrong.length? 'block':'none';
  const list = document.getElementById('wrong-list');
  list.innerHTML = wrong.map(r=>{
    const qtext = r.q.question.replace(/【(.+?)】/g,'$1');
    return '<div class="wrong-item"><b>'+r.q.answer+'</b> ─ '+esc(qtext)+' <span style="color:#aaa">('+r.q.src+')</span></div>';
  }).join('');
  // 苦手記録（プロトタイプ: 端末内）
  try{
    const store = JSON.parse(localStorage.getItem('otakara')||'{}');
    wrong.forEach(r=>{ store[r.q.id]=(store[r.q.id]||0)+1; });
    localStorage.setItem('otakara', JSON.stringify(store));
  }catch(e){}
  showScreen('scr-result');
}
function retryWrong(){
  S.quiz = shuffle(S.results.filter(r=>!r.correct).map(r=>r.q));
  S.idx=0; S.results=[];
  showScreen('scr-quiz'); renderQuestion();
}
function goHome(){ showScreen('scr-home'); }
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

buildUnitChips(); updateStart();
</script>
